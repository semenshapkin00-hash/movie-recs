[project]
name = "movie-recs"
version = "0.2.0"
description = "Movie recommendations with two towers, ALS, SANSA, and persistent user profiles"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
train = ["torch==2.9.1", "implicit>=0.7.2,<0.8"]
sansa = ["sansa==1.1.0", "scikit-sparse==0.4.16"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
